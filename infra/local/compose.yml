name: atlas
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-db}
      POSTGRES_DB: atlas
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: {context: ../.., dockerfile: infra/local/Dockerfile}
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas-local-db}@postgres:5432/atlas
      ATLAS_MODE: ${ATLAS_MODE:-deterministic}
      ATLAS_TOKEN_SECRET: ${ATLAS_TOKEN_SECRET:-local-compose-change-this-32-character-secret}
      ATLAS_DEMO_PASSWORD: ${ATLAS_DEMO_PASSWORD:-atlas-local-only}
      ATLAS_EMBEDDING_MODE: ${ATLAS_EMBEDDING_MODE:-hash}
      ATLAS_EMBEDDING_MODEL: ${ATLAS_EMBEDDING_MODEL:-all-minilm}
      ATLAS_MODEL: ${ATLAS_MODEL:-qwen2.5:0.5b}
      ATLAS_OLLAMA_URL: ${ATLAS_OLLAMA_URL:-http://host.docker.internal:11434}
      ATLAS_PRICE_VERSION: ${ATLAS_PRICE_VERSION:-}
      ATLAS_INPUT_USD_PER_MILLION: ${ATLAS_INPUT_USD_PER_MILLION:-0}
      ATLAS_OUTPUT_USD_PER_MILLION: ${ATLAS_OUTPUT_USD_PER_MILLION:-0}
      ATLAS_LITELLM_URL: ${ATLAS_LITELLM_URL:-}
      ATLAS_LITELLM_KEY: ${ATLAS_LITELLM_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${ATLAS_API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]
    build: {context: ../.., dockerfile: infra/local/Dockerfile}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    command: ["python", "-m", "services.worker.main"]
    restart: unless-stopped
volumes:
  postgres-data:
