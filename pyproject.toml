[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agentic-engineering"
version = "0.1.0"
description = "Atlas educational multi-tenant AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "sqlalchemy==2.0.41", "psycopg[binary]==3.2.9", "pgvector==0.4.1",
  "httpx==0.28.1", "langgraph==0.4.5", "langchain-core==0.3.60",
  "langgraph-checkpoint-sqlite==2.0.10", "langgraph-checkpoint-postgres==2.0.21",
  "mcp==1.9.4", "boto3==1.38.23", "opentelemetry-sdk==1.33.1",
  "opentelemetry-exporter-otlp-proto-http==1.33.1",
  "opentelemetry-instrumentation-fastapi==0.54b1", "opentelemetry-instrumentation-httpx==0.54b1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.11"]

[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires real local PostgreSQL", "e2e: browser journey", "provider: requires explicit provider credentials"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
